_schema-version: "3.2"
ID: buildProcessDemo
version: 0.0.1
modules:
- name: buildProcessDemo-destination-content
  type: com.sap.application.content
  requires:
  - name: buildProcessDemo-destination-service
    parameters:
      content-target: true
  - name: buildProcessDemo_html_repo_host
    parameters:
      service-key:
        name: buildProcessDemo_html_repo_host-key
  - name: uaa_buildProcessDemo
    parameters:
      service-key:
        name: uaa_buildProcessDemo-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: buildProcess_buildProcessDemo_html_repo_host
          ServiceInstanceName: buildProcessDemo-html5-app-host-service
          ServiceKeyName: buildProcessDemo_html_repo_host-key
          sap.cloud.service: buildProcess
        - Authentication: OAuth2UserTokenExchange
          Name: buildProcess_uaa_buildProcessDemo
          ServiceInstanceName: buildProcessDemo-xsuaa-service
          ServiceKeyName: uaa_buildProcessDemo-key
          sap.cloud.service: buildProcess
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: buildProcessDemo-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: buildProcessDemo_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - nsworkflowuimodule.zip
      name: nsworkflowuimodule
      target-path: resources/
- name: nsworkflowuimodule
  type: html5
  path: workflow-ui-module
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: buildProcessDemo-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: buildProcessDemo-destination-service
    service-plan: lite
- name: buildProcessDemo_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: buildProcessDemo-html5-app-host-service
    service-plan: app-host
- name: uaa_buildProcessDemo
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: buildProcessDemo-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
