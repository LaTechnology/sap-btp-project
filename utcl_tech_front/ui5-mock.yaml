specVersion: "3.1"
metadata:
  name: utcltechfront
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /odata/v2/mdkServices/
            url: https://cloud-founddry-c21d9e61trial-dev-btp-utcl-java-srv.cfapps.us10-001.hana.ondemand.com
            destination: utcl_mdk_service_des_v2_odata
            authenticationType: NoAuthentication
          - path: /odata
            url: https://cloud-founddry-c21d9e61trial-dev-utclcustomer-srv.cfapps.us10-001.hana.ondemand.com
            destination: utcl_customer_v4
            authenticationType: NoAuthentication
          - path: /odata/v2/UTCLCustomer/
            url: https://cloud-founddry-c21d9e61trial-dev-utclcustomer-srv.cfapps.us10-001.hana.ondemand.com
            destination: utcl_customer_v2
            authenticationType: NoAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /odata/v2/mdkServices
            generateMockData: true
            metadataXmlPath: ./webapp/localService/mainService/metadata.xml
            mockdataRootPath: ./webapp/localService/data
          - urlPath: /odata/v2/mdkServices/
            generateMockData: true
            metadataXmlPath: ./webapp/localService/mainService/metadata.xml
            mockdataRootPath: ./webapp/localService/mainService/mockdata
          - urlPath: /odata/v2/UTCLCustomer/
            metadataPath: ./webapp/localService/UTCLCustomer/metadata.xml
            mockdataPath: ./webapp/localService/UTCLCustomer/mockdata
            generateMockData: true
        annotations: []
